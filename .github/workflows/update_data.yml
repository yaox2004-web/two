name: 每日A股数据更新

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install akshare pandas pyarrow

      - name: 拉取数据
        run: python scripts/fetch_daily_data.py
        env:
          TZ: Asia/Shanghai

      - name: 提交并推送
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新: $(TZ=Asia/Shanghai date +'%Y-%m-%d') 市场数据"
            git push
          fi

