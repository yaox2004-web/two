name: Node Collector and Speedtest

on:
  schedule:
    # 每 6 小时自动运行一次 (UTC 时间)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 执行节点抓取与测速
      run: python main.py

    - name: 提交更新后的 sub.txt 到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sub.txt
        # 仅当有变化时才提交，防止无意义 commit 报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update nodes [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

